<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dark electric core with 3D depth</title>
  <desc id="desc">A dark graphite, electric-yellow, cyan, and violet animated 3D-style core for the zartk-23 GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/><stop offset="0.52" stop-color="#0B1018"/><stop offset="1" stop-color="#151024"/>
    </linearGradient>
    <linearGradient id="edge" x1="782" y1="98" x2="1050" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2A8"/><stop offset="0.42" stop-color="#F7D046"/><stop offset="1" stop-color="#F08A24"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(925 208) rotate(90) scale(132)">
      <stop stop-color="#FFF3A6" stop-opacity="0.98"/><stop offset="0.23" stop-color="#F7D046" stop-opacity="0.95"/><stop offset="0.58" stop-color="#EFAE35" stop-opacity="0.3"/><stop offset="1" stop-color="#F7D046" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="880" y1="108" x2="982" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9D5"/><stop offset="0.38" stop-color="#FFF0A0"/><stop offset="1" stop-color="#F7B51D"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#9AA5B1" stroke-opacity="0.08"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="18" y="18" width="1164" height="384" rx="18" fill="url(#grid)" opacity="0.7"/>
  <path d="M0 346C190 286 332 402 528 330C696 269 822 320 1200 246" stroke="#F7D046" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0 365C203 305 345 420 548 347C715 287 856 334 1200 267" stroke="#5BE7FF" stroke-opacity="0.08" stroke-width="1"/>
  <g opacity="0.7">
    <rect x="72" y="102" width="270" height="2" rx="1" fill="#F7D046" fill-opacity="0.34"/>
    <rect x="72" y="124" width="190" height="2" rx="1" fill="#A8B3C2" fill-opacity="0.22"/>
    <rect x="72" y="178" width="232" height="2" rx="1" fill="#A8B3C2" fill-opacity="0.16"/>
    <rect x="72" y="200" width="166" height="2" rx="1" fill="#A8B3C2" fill-opacity="0.12"/>
    <rect x="72" y="254" width="114" height="28" rx="14" fill="#F7D046" fill-opacity="0.08" stroke="#F7D046" stroke-opacity="0.26"/>
    <circle cx="94" cy="318" r="4" fill="#F7D046"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="116" cy="318" r="4" fill="#5BE7FF"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="138" cy="318" r="4" fill="#B99CFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>
  <g filter="url(#soft)" opacity="0.28"><circle cx="928" cy="210" r="120" fill="#F7D046"/></g>
  <g transform="translate(925 210)">
    <ellipse rx="170" ry="72" transform="rotate(-22)" stroke="#F7D046" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 12"><animateTransform attributeName="transform" type="rotate" from="-22" to="338" dur="18s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="154" ry="64" transform="rotate(30)" stroke="#5BE7FF" stroke-opacity="0.13" stroke-width="1.5" stroke-dasharray="2 14"><animateTransform attributeName="transform" type="rotate" from="30" to="390" dur="26s" repeatCount="indefinite"/></ellipse>
    <circle r="132" fill="url(#core)"/>
    <path d="M-48 -103L73 -72L127 6L57 102L-71 72L-126 -8L-48 -103Z" fill="#0C111B" fill-opacity="0.72" stroke="url(#edge)" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M-48 -103L-2 -79L-8 37L-71 72L-126 -8L-48 -103Z" fill="#162032" fill-opacity="0.8"/>
    <path d="M-48 -103L73 -72L127 6L57 102L-8 37L-2 -79L-48 -103Z" fill="#272044" fill-opacity="0.75"/>
    <path d="M-2 -79L73 -72L127 6L-8 37L-2 -79Z" fill="#4B3B79" fill-opacity="0.5"/>
    <path d="M-13 -88L-72 13L-28 10L-54 82L43 -32L2 -29L35 -88H-13Z" fill="url(#bolt)" filter="url(#glow)"><animate attributeName="opacity" values="0.82;1;0.86;1;0.82" dur="2.8s" repeatCount="indefinite"/></path>
    <circle cx="-102" cy="-49" r="4" fill="#FFF3A6"><animate attributeName="r" values="2;5;2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="108" cy="60" r="3" fill="#5BE7FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <g opacity="0.8">
    <circle cx="1072" cy="80" r="2" fill="#F7D046"><animate attributeName="cy" values="80;72;80" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1125" cy="320" r="2" fill="#5BE7FF"><animate attributeName="cx" values="1125;1112;1125" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="762" cy="334" r="2" fill="#B99CFF"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
