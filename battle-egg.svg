<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mini electric battle Easter egg</title>
  <desc id="desc">A dark animated battle screen with an electric mouse-inspired companion facing a violet vector creature.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#05070B"/><stop offset="0.5" stop-color="#10131D"/><stop offset="1" stop-color="#1B1127"/></linearGradient>
    <linearGradient id="yellow" x1="210" y1="90" x2="390" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF5B0"/><stop offset="0.35" stop-color="#F7D046"/><stop offset="1" stop-color="#F08A24"/></linearGradient>
    <linearGradient id="violet" x1="820" y1="74" x2="996" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#D7C8FF"/><stop offset="0.45" stop-color="#9C7BFF"/><stop offset="1" stop-color="#5E3E9A"/></linearGradient>
    <radialGradient id="glowY"><stop stop-color="#F7D046" stop-opacity="0.6"/><stop offset="1" stop-color="#F7D046" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV"><stop stop-color="#B99CFF" stop-opacity="0.45"/><stop offset="1" stop-color="#B99CFF" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="attack" x="-200%" y="-200%" width="400%" height="400%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#9AA5B1" stroke-opacity="0.07"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="18" y="18" width="1164" height="264" rx="15" fill="url(#grid)"/>
  <path d="M0 246C180 202 320 273 498 235C686 196 840 235 1200 154" stroke="#F7D046" stroke-opacity="0.12" stroke-width="2"/>

  <g opacity="0.7">
    <rect x="88" y="48" width="254" height="12" rx="6" fill="#151B27" stroke="#F7D046" stroke-opacity="0.42"/>
    <rect x="96" y="52" width="190" height="4" rx="2" fill="#F7D046" fill-opacity="0.7"><animate attributeName="width" values="190;208;190" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="858" y="48" width="254" height="12" rx="6" fill="#151B27" stroke="#B99CFF" stroke-opacity="0.42"/>
    <rect x="866" y="52" width="162" height="4" rx="2" fill="#B99CFF" fill-opacity="0.7"><animate attributeName="width" values="162;142;162" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="88" y="70" width="92" height="4" rx="2" fill="#8B949E" fill-opacity="0.3"/>
    <rect x="1018" y="70" width="94" height="4" rx="2" fill="#8B949E" fill-opacity="0.3"/>
  </g>

  <ellipse cx="300" cy="158" rx="128" ry="104" fill="url(#glowY)" filter="url(#blur)"/>
  <ellipse cx="910" cy="148" rx="130" ry="108" fill="url(#glowV)" filter="url(#blur)"/>

  <!-- electric companion -->
  <g transform="translate(295 158)">
    <path d="M-49 -58L-89 -116L-38 -91L-2 -60Z" fill="url(#yellow)" stroke="#F7D046" stroke-opacity="0.75" stroke-width="3"/>
    <path d="M43 -61L88 -112L78 -47L19 -31Z" fill="url(#yellow)" stroke="#F7D046" stroke-opacity="0.75" stroke-width="3"/>
    <ellipse cx="0" cy="17" rx="70" ry="73" fill="url(#yellow)" stroke="#F7D046" stroke-opacity="0.8" stroke-width="3"/>
    <circle cx="-25" cy="4" r="8" fill="#090C12"/><circle cx="26" cy="4" r="8" fill="#090C12"/>
    <circle cx="-23" cy="2" r="2.5" fill="#F3F4F6"/><circle cx="28" cy="2" r="2.5" fill="#F3F4F6"/>
    <circle cx="-58" cy="29" r="13" fill="#F04B54" fill-opacity="0.82"/><circle cx="58" cy="29" r="13" fill="#F04B54" fill-opacity="0.82"/>
    <path d="M-10 28Q0 38 10 28" stroke="#090C12" stroke-width="4" stroke-linecap="round"/>
    <path d="M-68 80L-126 55L-101 24L-151 5L-106 -8L-84 -2L-104 22L-69 33Z" fill="url(#yellow)" stroke="#F7D046" stroke-width="3"/>
    <circle cx="-108" cy="96" r="4" fill="#FFF3A6"><animate attributeName="r" values="2;6;2" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- vector creature -->
  <g transform="translate(910 151)">
    <path d="M0 -84L75 -42L75 42L0 84L-75 42L-75 -42L0 -84Z" fill="url(#violet)" fill-opacity="0.82" stroke="#B99CFF" stroke-opacity="0.9" stroke-width="3"/>
    <path d="M0 -84L0 84M-75 -42L0 0L75 -42M-75 42L0 0L75 42" stroke="#F3F4F6" stroke-opacity="0.24" stroke-width="2"/>
    <circle cx="-25" cy="-4" r="7" fill="#090C12"/><circle cx="25" cy="-4" r="7" fill="#090C12"/>
    <path d="M-29 30Q0 48 29 30" stroke="#090C12" stroke-width="4" stroke-linecap="round"/>
    <circle cx="93" cy="-72" r="4" fill="#5BE7FF"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- attack line -->
  <g filter="url(#attack)">
    <path d="M426 151L469 128L510 154L551 126L592 152L634 128L678 153L720 126" stroke="#F7D046" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="13 18">
      <animate attributeName="stroke-dashoffset" values="0;-62" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <circle cx="458" cy="146" r="5" fill="#FFF3A6"><animate attributeName="cx" values="438;709;438" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0.8">
    <rect x="470" y="240" width="86" height="10" rx="5" fill="#F7D046" fill-opacity="0.17" stroke="#F7D046" stroke-opacity="0.32"/>
    <rect x="567" y="240" width="86" height="10" rx="5" fill="#5BE7FF" fill-opacity="0.1" stroke="#5BE7FF" stroke-opacity="0.28"/>
    <rect x="664" y="240" width="86" height="10" rx="5" fill="#B99CFF" fill-opacity="0.1" stroke="#B99CFF" stroke-opacity="0.28"/>
  </g>
</svg>
