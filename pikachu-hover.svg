<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hover-triggered thunderbolt</title>
  <desc id="desc">Hover over the yellow electric companion to trigger a CSS-animated thunderbolt strike.</desc>
  <style>
    #pikachu { cursor: crosshair; transform-box: fill-box; transform-origin: center; transition: filter .2s ease, transform .2s ease; }
    #pikachu:hover { filter: url(#glow); transform: translateY(-4px) scale(1.02); }
    #bolt { opacity: 0; transform-box: fill-box; transform-origin: center; transform: translateX(-74px) scale(.55) rotate(-12deg); }
    #pikachu:hover ~ #bolt { opacity: 1; animation: thunderStrike .62s cubic-bezier(.17,.84,.32,1) both; }
    #impact { opacity: 0; transform-box: fill-box; transform-origin: center; }
    #pikachu:hover ~ #impact { opacity: 1; animation: impactFlash .55s ease-out both; }
    .spark { opacity: .2; animation: twinkle 2.2s ease-in-out infinite; }
    .s2 { animation-delay: .4s; }.s3 { animation-delay: .9s; }.s4 { animation-delay: 1.4s; }
    @keyframes thunderStrike { 0% { opacity: 0; transform: translateX(-74px) scale(.55) rotate(-12deg); } 30% { opacity: 1; } 65% { transform: translateX(8px) scale(1.08) rotate(2deg); } 100% { opacity: 1; transform: translateX(0) scale(1) rotate(0); } }
    @keyframes impactFlash { 0% { opacity: 0; transform: scale(.4); } 38% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1.7); } }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#05070B"/><stop offset=".5" stop-color="#10131D"/><stop offset="1" stop-color="#1B1127"/></linearGradient>
    <linearGradient id="yellow" x1="210" y1="90" x2="390" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF5B0"/><stop offset=".35" stop-color="#F7D046"/><stop offset="1" stop-color="#F08A24"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#9AA5B1" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" stroke="#FFFFFF" stroke-opacity=".08"/>
  <rect x="18" y="18" width="1164" height="264" rx="15" fill="url(#grid)"/>
  <path d="M0 246C180 202 320 273 498 235C686 196 840 235 1200 154" stroke="#F7D046" stroke-opacity=".12" stroke-width="2"/>
  <g class="spark s1"><circle cx="80" cy="100" r="3" fill="#5BE7FF"/></g><g class="spark s2"><circle cx="470" cy="88" r="3" fill="#F7D046"/></g><g class="spark s3"><circle cx="1010" cy="102" r="3" fill="#B99CFF"/></g><g class="spark s4"><circle cx="1060" cy="248" r="3" fill="#5BE7FF"/></g>
  <g opacity=".7"><rect x="88" y="48" width="254" height="12" rx="6" fill="#151B27" stroke="#F7D046" stroke-opacity=".42"/><rect x="96" y="52" width="190" height="4" rx="2" fill="#F7D046" fill-opacity=".7"/><rect x="858" y="48" width="254" height="12" rx="6" fill="#151B27" stroke="#B99CFF" stroke-opacity=".42"/><rect x="866" y="52" width="162" height="4" rx="2" fill="#B99CFF" fill-opacity=".7"/></g>
  <g id="pikachu" transform="translate(295 151)">
    <path d="M-49 -58L-89 -116L-38 -91L-2 -60Z" fill="url(#yellow)" stroke="#F7D046" stroke-width="3"/>
    <path d="M43 -61L88 -112L78 -47L19 -31Z" fill="url(#yellow)" stroke="#F7D046" stroke-width="3"/>
    <ellipse cx="0" cy="17" rx="70" ry="73" fill="url(#yellow)" stroke="#F7D046" stroke-width="3"/>
    <circle cx="-25" cy="4" r="8" fill="#090C12"/><circle cx="26" cy="4" r="8" fill="#090C12"/><circle cx="-23" cy="2" r="2.5" fill="#F3F4F6"/><circle cx="28" cy="2" r="2.5" fill="#F3F4F6"/>
    <circle cx="-58" cy="29" r="13" fill="#F04B54"/><circle cx="58" cy="29" r="13" fill="#F04B54"/><path d="M-10 28Q0 38 10 28" stroke="#090C12" stroke-width="4" stroke-linecap="round"/>
    <path d="M-68 80L-126 55L-101 24L-151 5L-106 -8L-84 -2L-104 22L-69 33Z" fill="url(#yellow)" stroke="#F7D046" stroke-width="3"/>
  </g>
  <g id="bolt" filter="url(#glow)"><path d="M478 90L425 177L468 172L430 255L548 141L502 147L540 90Z" fill="url(#yellow)" stroke="#FFF5B0" stroke-width="3"/></g>
  <g id="impact" filter="url(#glow)"><circle cx="548" cy="176" r="22" fill="none" stroke="#F7D046" stroke-width="5"/><circle cx="548" cy="176" r="44" fill="none" stroke="#5BE7FF" stroke-opacity=".7" stroke-width="2"/></g>
  <g opacity=".75"><rect x="770" y="86" width="260" height="12" rx="6" fill="#151B27" stroke="#B99CFF" stroke-opacity=".45"/><rect x="780" y="90" width="180" height="4" rx="2" fill="#B99CFF"/><path d="M950 210L1015 173L1080 210L1015 247Z" fill="#3D2B68" stroke="#B99CFF" stroke-opacity=".55" stroke-width="3"/><path d="M1015 173V247M950 210H1080" stroke="#F3F4F6" stroke-opacity=".23" stroke-width="2"/></g>
</svg>
