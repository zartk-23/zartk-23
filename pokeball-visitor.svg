<svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pokéball visitor badge</title>
  <desc id="desc">A compact red, white, and black Pokéball icon used as a visitor counter emblem.</desc>
  <defs>
    <radialGradient id="red" cx="0" cy="0" r="1" gradientTransform="translate(21 12) rotate(90) scale(16)"><stop stop-color="#FF8A8F"/><stop offset=".45" stop-color="#F04B54"/><stop offset="1" stop-color="#9E2637"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="21" cy="21" r="18" fill="#0A0D13" stroke="#F7D046" stroke-opacity=".72" stroke-width="2"/>
  <path d="M4 21C4 11.61 11.61 4 21 4C30.39 4 38 11.61 38 21H4Z" fill="url(#red)"/>
  <path d="M4 21H38" stroke="#090C12" stroke-width="5"/>
  <circle cx="21" cy="21" r="8" fill="#090C12" stroke="#F3F4F6" stroke-width="2"/>
  <circle cx="21" cy="21" r="4" fill="#F7D046" filter="url(#glow)"><animate attributeName="r" values="3.2;4.8;3.2" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
