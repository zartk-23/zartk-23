<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Electric encounter</title>
  <style>
    :root { color-scheme: dark; --bg: #07090f; --panel: #0e1420; --yellow: #f7d046; --red: #f04b54; --cyan: #5be7ff; --muted: #8b949e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 70% 35%, #251b46 0, transparent 32%), var(--bg); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .arena { width: min(1100px, 94vw); padding: 34px; overflow: hidden; border: 1px solid rgba(247,208,70,.25); border-radius: 24px; background: linear-gradient(135deg, rgba(10,14,22,.98), rgba(21,16,36,.98)); box-shadow: 0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
    .eyebrow { margin: 0 0 8px; color: var(--yellow); font: 700 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; color: #f3f4f6; font-size: clamp(28px, 5vw, 58px); letter-spacing: -.05em; }
    .hint { margin: 12px 0 0; color: var(--muted); }
    .stage { position: relative; min-height: 410px; margin-top: 24px; overflow: hidden; border-radius: 18px; border: 1px solid rgba(255,255,255,.07); background: linear-gradient(180deg, rgba(255,255,255,.025), transparent), repeating-linear-gradient(0deg, transparent 0 31px, rgba(139,148,158,.07) 32px), repeating-linear-gradient(90deg, transparent 0 31px, rgba(139,148,158,.07) 32px); }
    .stage::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: 22%; height: 1px; background: linear-gradient(90deg, transparent, rgba(247,208,70,.4), transparent); }
    svg { display: block; width: 100%; height: 410px; }
    #pikachu { cursor: crosshair; transform-origin: 28% 58%; transition: filter .2s ease, transform .2s ease; }
    #pikachu:hover { filter: drop-shadow(0 0 18px rgba(247,208,70,.75)); transform: translateY(-4px) scale(1.015); }
    #bolt { opacity: 0; transform: translateX(-80px) scale(.55); transform-origin: center; transition: opacity .12s ease; }
    #pikachu:hover ~ #bolt { opacity: 1; animation: thunderStrike .62s cubic-bezier(.17,.84,.32,1) both; }
    #impact { opacity: 0; transform: scale(.4); transform-origin: center; }
    #pikachu:hover ~ #impact { opacity: 1; animation: impactFlash .55s ease-out both; }
    .spark { opacity: .25; animation: twinkle 2.2s ease-in-out infinite; }
    .spark:nth-child(2) { animation-delay: .4s; }.spark:nth-child(3) { animation-delay: .9s; }.spark:nth-child(4) { animation-delay: 1.4s; }
    @keyframes thunderStrike { 0% { opacity: 0; transform: translateX(-110px) scale(.5) rotate(-12deg); } 30% { opacity: 1; } 65% { transform: translateX(8px) scale(1.08) rotate(2deg); } 100% { opacity: 1; transform: translateX(0) scale(1) rotate(0); } }
    @keyframes impactFlash { 0% { opacity: 0; transform: scale(.4); } 38% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1.7); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .legend { display: flex; gap: 14px; align-items: center; margin-top: 16px; color: var(--muted); font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
  </style>
</head>
<body>
  <main class="arena">
    <p class="eyebrow">electric encounter / css hover field</p>
    <h1>Hover the silhouette.</h1>
    <p class="hint">Move your cursor over the electric companion to trigger a thunderbolt strike.</p>
    <section class="stage" aria-label="Hover interaction demo">
      <svg viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
        <title id="title">Pikachu-inspired hover thunderbolt demo</title>
        <desc id="desc">Hover over the yellow electric companion to trigger the animated thunderbolt.</desc>
        <defs>
          <linearGradient id="yellow" x1="190" y1="110" x2="370" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#fff5b0"/><stop offset=".35" stop-color="#f7d046"/><stop offset="1" stop-color="#f08a24"/></linearGradient>
          <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g class="spark"><circle cx="80" cy="100" r="3" fill="#5be7ff"/></g><g class="spark"><circle cx="470" cy="88" r="3" fill="#f7d046"/></g><g class="spark"><circle cx="1010" cy="102" r="3" fill="#b99cff"/></g><g class="spark"><circle cx="1060" cy="300" r="3" fill="#5be7ff"/></g>
        <g id="pikachu" transform="translate(280 196)">
          <path d="M-54 -61L-98 -139L-42 -104L-4 -64Z" fill="url(#yellow)" stroke="#f7d046" stroke-width="4"/>
          <path d="M48 -63L98 -134L86 -52L23 -29Z" fill="url(#yellow)" stroke="#f7d046" stroke-width="4"/>
          <ellipse cx="0" cy="18" rx="76" ry="80" fill="url(#yellow)" stroke="#f7d046" stroke-width="4"/>
          <circle cx="-28" cy="4" r="9" fill="#090c12"/><circle cx="28" cy="4" r="9" fill="#090c12"/>
          <circle cx="-25" cy="1" r="3" fill="#f3f4f6"/><circle cx="31" cy="1" r="3" fill="#f3f4f6"/>
          <circle cx="-64" cy="33" r="15" fill="#f04b54"/><circle cx="64" cy="33" r="15" fill="#f04b54"/>
          <path d="M-12 32Q0 44 12 32" fill="none" stroke="#090c12" stroke-width="5" stroke-linecap="round"/>
          <path d="M-75 87L-143 58L-112 24L-170 0L-119 -12L-91 -4L-113 23L-72 35Z" fill="url(#yellow)" stroke="#f7d046" stroke-width="4"/>
        </g>
        <g id="bolt" filter="url(#glow)">
          <path d="M478 90L425 177L468 172L430 255L548 141L502 147L540 90Z" fill="url(#yellow)" stroke="#fff5b0" stroke-width="3"/>
        </g>
        <g id="impact" filter="url(#glow)"><circle cx="548" cy="176" r="22" fill="none" stroke="#f7d046" stroke-width="5"/><circle cx="548" cy="176" r="44" fill="none" stroke="#5be7ff" stroke-opacity=".7" stroke-width="2"/></g>
        <g opacity=".75"><rect x="770" y="86" width="260" height="12" rx="6" fill="#151b27" stroke="#b99cff" stroke-opacity=".45"/><rect x="780" y="90" width="180" height="4" rx="2" fill="#b99cff"/><path d="M950 210L1015 173L1080 210L1015 247Z" fill="#3d2b68" stroke="#b99cff" stroke-opacity=".55" stroke-width="3"/><path d="M1015 173V247M950 210H1080" stroke="#f3f4f6" stroke-opacity=".23" stroke-width="2"/></g>
      </svg>
    </section>
    <p class="legend"><span class="dot"></span> Hover is CSS-only. No JavaScript required.</p>
  </main>
</body>
</html>
